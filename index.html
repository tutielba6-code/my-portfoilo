<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings from Turdibek</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #2f81f7;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            max-width: 450px;
            width: 90%;
        }

        .avatar-area {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .subtitle {
            color: #8b949e;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .tg-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #2481cc;
            color: #ffffff;
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 50px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(36, 129, 204, 0.3);
        }

        .tg-btn:hover {
            background-color: #2895e6;
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">👋</div>
        <h1>Greetings! I'm Turdibek</h1>
        <p class="subtitle">Welcome to my space. Click the button below to connect with me directly through my Telegram bot!</p>
        
        <a href="https://t.me/YOUR_BOT_USERNAME" target="_blank" class="tg-btn">Launch Telegram Bot</a>
    </div>

</body>
</html>
